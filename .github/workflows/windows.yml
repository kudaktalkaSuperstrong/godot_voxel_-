name: 🚪 Windows Builds

on:
  push:
    branches:
      - master
      - github_actions
      - godot3.x
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Global Cache Settings
env:
  GODOT_BASE_BRANCH: "3.x"
  SCONS_CACHE_MSVC_CONFIG: true
  SCONS_CACHE_LIMIT: 4096

jobs:
  windows-editor:
    runs-on: "windows-latest"
    name: Editor

    steps:
      # Clone Godot
      - uses: actions/checkout@v2
        with:
          repository: godotengine/godot
          ref: 3.x

      # Clone our module under the correct directory
      - uses: actions/checkout@v2
        with:
          path: modules/voxel

      # Upload cache on completion and check it out now
      - name: Load .scons_cache directory
        id: windows-editor-cache
        uses: actions/cache@v2
        with:
          path: /.scons_cache/
          key: ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}-${{ github.ref }}-${{ github.sha }}
            ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}-${{ github.ref }}
            ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}

      # Use python 3.x release
      - name: Set up Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
          architecture: 'x64'

      # Setup scons
      - name: Configuring Python packages
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons pywin32
          python --version
          scons --version

      # Compilation
      - name: Compilation
        env:
          SCONS_CACHE: /.scons_cache/
        run: |
          scons -j2 verbose=yes warnings=all werror=yes platform=windows tools=yes tests=no target=release_debug

      # Make build available
      - uses: actions/upload-artifact@v2
        with:
          name: godot.windows.opt.tools.64.exe
          path: bin/godot.windows.opt.tools.64.exe

  windows-template:
    runs-on: "windows-latest"
    name: Release

    steps:
      # Clone Godot
      - uses: actions/checkout@v2
        with:
          repository: godotengine/godot
          ref: 3.x

      # Clone our module under the correct directory
      - uses: actions/checkout@v2
        with:
          path: modules/voxel

      # Upload cache on completion and check it out now
      - name: Load .scons_cache directory
        id: windows-template-cache
        uses: RevoluPowered/cache@v2.1
        with:
          path: /.scons_cache/
          key: ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}-${{ github.ref }}-${{ github.sha }}
            ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}-${{ github.ref }}
            ${{ github.job }}-${{ env.GODOT_BASE_BRANCH }}

      # Use python 3.x release
      - name: Set up Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
          architecture: 'x64'

      # Setup scons
      - name: Configuring Python packages
        run: |
          python -c "import sys; print(sys.version)"
          python -m pip install scons pywin32
          python --version
          scons --version

      # Compilation
      - name: Compilation
        env:
          SCONS_CACHE: /.scons_cache/
        run: |
          scons -j2 verbose=yes warnings=all werror=yes platform=windows tools=no tests=no target=release

      # Make build available
      - uses: actions/upload-artifact@v2
        with:
          name: godot.windows.opt.64.exe
          path: bin/godot.windows.opt.64.exe
